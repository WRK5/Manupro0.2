<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Manutenção</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { min-height: 100%; background: #f2f2f4; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #111; line-height: 1.45; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
  .wrap { width: 100%; max-width: 520px; margin: 0 auto; padding: 12px 12px 60px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 14px; line-height: 1.2; }
  .subtitle { color: #888; font-size: 14px; margin: -10px 0 16px; }  /* ABAS - rolagem lateral no celular */
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tab { flex: 1 1 auto; padding: 9px 8px; border-radius: 999px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; color: #555; text-align: center; white-space: nowrap; }
.tab[aria-selected="true"] { background: #111; color: #fff; border-color: #111; }
.section { display: none; }
.section.active { display: block; }

/* BOTÕES - grandes para toque */
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.btn { padding: 12px 16px; border-radius: 12px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 15px; font-weight: 500; color: #111; min-height: 46px; -webkit-appearance: none; appearance: none; }
.btn:active { transform: scale(.97); }
.btn-primary { background: #111; color: #fff; border-color: #111; }
.btn-danger { color: #c00; border-color: #e5a5a5; }
.btn-success { background: #2e7d32; color: #fff; border-color: #2e7d32; }
.btn-warning { background: #b8860b; color: #fff; border-color: #b8860b; }
.btn:disabled { opacity: .5; }
.toolbar .btn-primary { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; }

/* CARDS */
.card { border: 1px solid #e4e4e7; border-radius: 14px; padding: 14px; margin-bottom: 10px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
.card-title { font-weight: 600; font-size: 16px; }
.card-meta { font-size: 13px; color: #888; margin-top: 3px; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-right: 6px; }
.badge-urgente { background: #ffeaea; color: #c00; }
.badge-atencao { background: #fff6da; color: #9c7105; }
.badge-ok { background: #e8f5e9; color: #2e7d32; }
.badge-info { background: #e3f2fd; color: #1565c0; }
.badge-arq { background: #f3e5f5; color: #6a1b9a; }
.card-body { margin-top: 8px; font-size: 15px; line-height: 1.5; color: #333; }
.thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.thumbs-label { font-size: 12px; color: #888; width: 100%; margin-top: 6px; font-weight: 600; }
.thumb { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; border: 1px solid #e0e0e0; cursor: pointer; }
.row-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.row-actions button { flex: 1 1 30%; min-height: 42px; font-size: 13px; padding: 6px 8px; border-radius: 10px; }

/* MODAL - tela cheia no celular */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; width: 100%; height: 100%; max-width: 560px; overflow-y: auto; padding: 18px 16px 30px; }
@media (min-width: 620px) {
.modal-overlay { padding: 24px; }
.modal { height: auto; max-height: 88vh; border-radius: 16px; border: 1px solid #e0e0e0; }
}
.modal h2 { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; }
.field input, .field textarea, .field select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; background: #fafafa; color: #111; font-size: 16px; font-family: inherit; -webkit-appearance: none; appearance: none; }
.field select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23888' stroke-width='2' fill='none' stroke-linecap='round'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 34px; }
.field textarea { min-height: 90px; resize: vertical; }
.photo-preview { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-actions .btn { flex: 1; padding: 14px; font-size: 16px; }

.empty { text-align: center; padding: 36px 16px; color: #aaa; font-size: 14px; }

/* STATS - 3 colunas fixas */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.stat { border: 1px solid #e4e4e7; border-radius: 12px; padding: 10px 6px; text-align: center; background: #fff; }
.stat-value { font-size: 21px; font-weight: 700; line-height: 1.1; }
.stat-label { font-size: 11px; color: #888; margin-top: 3px; }

.search-wrap { display: flex; gap: 8px; margin-bottom: 12px; }
.search-wrap input { flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 1px solid #ddd; background: #fff; color: #111; font-size: 16px; font-family: inherit; -webkit-appearance: none; appearance: none; }
.search-wrap .btn { padding: 12px 14px; }

.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 200; padding: 12px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 96vw; max-height: 92vh; border-radius: 10px; }

.checkbox-wrap { display: flex; align-items: center; gap: 8px; }
.checkbox-wrap input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: #111; flex: 0 0 auto; }

.batch-bar { display: none; gap: 8px; align-items: center; padding: 12px; background: #111; border-radius: 14px; margin-bottom: 12px; flex-wrap: wrap; }
.batch-bar.open { display: flex; }
.batch-bar span { font-size: 13px; color: #fff; width: 100%; }
.batch-bar .btn { border-color: #444; }

.doc-tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: #e8f5e9; color: #2e7d32; margin-left: 6px; font-weight: 600; }
.doc-tag.pending { background: #fff6da; color: #9c7105; }

.toast { position: fixed; left: 12px; right: 12px; bottom: 12px; background: #111; color: #fff; padding: 13px 16px; border-radius: 12px; font-size: 15px; z-index: 300; transform: translateY(120px); opacity: 0; transition: all .3s ease; text-align: center; max-width: 500px; margin: 0 auto; }
.toast.show { transform: translateY(0); opacity: 1; }

/* TOPO DO SISTEMA - fixo ao rolar */
.app-top { position: sticky; top: 0; z-index: 50; background: #f2f2f4; padding: 10px 0 8px; margin: -10px 0 10px; }
.app-top-row { display: flex; align-items: center; gap: 10px; }
.app-top h1 { font-size: 19px; margin: 0; }
.app-sub { font-size: 12px; color: #888; margin-top: 2px; }
.project-counts { font-size: 13px; color: #888; margin-top: 8px; }
.project-counts b { color: #c00; }

/* Telas muito pequenas (iPhone antigo, Android compacto) */
@media (max-width: 380px) {
.wrap { padding: 10px 8px 50px; }
.tab { font-size: 12px; padding: 8px 6px; }
.stat-value { font-size: 18px; }
.stat-label { font-size: 10px; }
.btn { font-size: 14px; padding: 11px 12px; min-height: 44px; }
.thumb { width: 64px; height: 64px; }
.app-top h1 { font-size: 17px; }
.card { padding: 12px; }
.row-actions button { flex: 1 1 28%; font-size: 12px; }
}

/* ===== SISTEMA DE AJUDA / TUTORIAL (camada independente) ===== */
.tut-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:flex-end;justify-content:center;padding:12px;}
.tut-overlay.open{display:flex;}
.tut-card{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tutUp .25s ease;max-height:80vh;overflow-y:auto;}
@keyframes tutUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.tut-card h3{font-size:16px;margin:0 0 8px;}
.tut-card .tut-body{font-size:14px;color:#333;line-height:1.55;}
.tut-card .tut-body b{color:#111;}
.tut-progress{font-size:12px;color:#888;margin-top:10px;}
.tut-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.tut-actions .btn{flex:1;min-height:44px;font-size:14px;}
.tut-skip{background:none;border:none;color:#888;font-size:13px;cursor:pointer;padding:10px;width:100%;text-align:center;min-height:40px;}
.tut-dont{display:flex;align-items:center;gap:8px;font-size:13px;color:#555;margin-top:10px;}
.tut-dont input{width:20px;height:20px;accent-color:#111;flex:0 0 auto;}
.tut-highlight{position:relative;z-index:401 !important;box-shadow:0 0 0 3px #111,0 0 0 8px rgba(255,255,255,.85) !important;border-radius:12px !important;}
.tut-topic{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:1px solid #e0e0e0;border-radius:12px;background:#fafafa;margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:500;color:#111;min-height:46px;font-family:inherit;}
.tut-topic:active{background:#eee;}
@media (min-width:620px){.tut-overlay{align-items:center;}}

</style>

  (function seedHotel(){
    try{
      let p = projects.find(function(x){ return x.nome === SEED_HOTEL.nome; });
      if(!p){
        p = {
          id: projects.length ? Math.max.apply(null, projects.map(function(x){ return x.id; })) + 1 : 1,
          icon: SEED_HOTEL.icon, nome: SEED_HOTEL.nome, cnpj: SEED_HOTEL.cnpj,
          endereco: SEED_HOTEL.endereco, servico: SEED_HOTEL.servico, criadoEm: Date.now()
        };
        projects.push(p);
        saveProjects();
      } else if(!p.cnpj){
        p.cnpj = SEED_HOTEL.cnpj; p.endereco = SEED_HOTEL.endereco;
        p.servico = SEED_HOTEL.servico; if(!p.icon) p.icon = SEED_HOTEL.icon;
        saveProjects();
      }
      const jaTem = loadProjectItems(p);
      if(!jaTem.length){
        localStorage.setItem(itemKey(p.id), JSON.stringify(SEED_HOTEL_ITEMS));
      }
    }catch(e){}
  })();

  function saveProjects(){ localStorage.setItem(KEY_PROJECTS, JSON.stringify(projects)); }
  function itemKey(id){ return KEY_ITEMS_PREFIX + id; }
  function getProject(id){ return projects.find(x=>x.id===id); }
  function projIcon(p){ return p.icon || "🏢"; }

  function loadProjectItems(p){
    try{ return JSON.parse(localStorage.getItem(itemKey(p.id)) || "[]"); }
    catch(e){ return []; }
  }

  function projectCounts(p){
    let pend = 0, urg = 0;
    const its = loadProjectItems(p);
    its.forEach(it=>{
      if(!it.arquivado){
        if(it.section === "pendencias") pend++;
        if(it.status === "urgente") urg++;
      }
    });
    return { pend: pend, urg: urg, total: its.length };
  }

  window.renderHome = function(){
    const q = (document.getElementById("projectSearch").value || "").toLowerCase().trim();
    const list = projects.filter(p => !q || p.nome.toLowerCase().includes(q) || (p.cnpj||"").includes(q) || (p.endereco||"").toLowerCase().includes(q));
    const el = document.getElementById("projectList");
    if(!list.length){
      if(projects.length){
        el.innerHTML = '<div class="empty">Nenhum projeto encontrado.</div>';
      } else {
        el.innerHTML = '<div class="empty">Nenhum sistema criado ainda.<br>Preencha o formulário acima para começar!</div>' +
          '<div class="card" style="background:#fff8e1;border-color:#e8d48b;">' +
          '<div class="card-body" style="font-size:13px;color:#7a6210;">' +
          '⚠️ <b>Seus dados sumiram?</b> Os projetos ficam guardados <b>dentro do navegador</b>, não no arquivo. ' +
          'Abra este arquivo <b>sempre pelo mesmo navegador</b> (evite abrir pelo "Visualizador de arquivos" ou aba anônima). ' +
          'Se tiver um arquivo de backup, use <b>⬆️ Restaurar backup</b> acima.' +
          '</div></div>';
      }
      return;
    }
    el.innerHTML = list.map(p=>{
      const c = projectCounts(p);
      return `
      <div class="card">
        <div class="card-title" style="font-size:17px;">${projIcon(p)} ${escapeHtml(p.nome)}</div>
        <div class="card-meta">
          ${p.cnpj ? "CNPJ: " + escapeHtml(p.cnpj) + "<br>" : ""}
          ${p.endereco ? "📍 " + escapeHtml(p.endereco) : ""}
        </div>
        ${p.servico ? `<div class="card-body" style="margin-top:6px;">${escapeHtml(p.servico)}</div>` : ""}
        <div class="project-counts">${c.total} item(ns) — ${c.pend} pendência(s)${c.urg ? `, <b>${c.urg} urgente(s)</b>` : ""}</div>
        <div class="row-actions">
          <button class="btn btn-primary" onclick="openProject(${p.id})">Abrir</button>
          <button class="btn" onclick="editProject(${p.id})">✏️ Editar</button>
          <button class="btn btn-danger" onclick="deleteProject(${p.id})">🗑️ Apagar</button>
        </div>
      </div>`;
    }).join("");
  };

  window.createProject = function(){
    const nome = document.getElementById("pNome").value.trim();
    if(!nome){ alert("Informe o nome do local / projeto."); return; }
    const p = {
      id: projects.length ? Math.max(...projects.map(x=>x.id)) + 1 : 1,
      icon: document.getElementById("pIcon").value,
      nome: nome,
      cnpj: document.getElementById("pCnpj").value.trim(),
      endereco: document.getElementById("pEndereco").value.trim(),
      servico: document.getElementById("pServico").value.trim(),
      criadoEm: Date.now()
    };
    projects.push(p);
    localStorage.setItem(itemKey(p.id), "[]");
    saveProjects();
    document.getElementById("pIcon").value = "🏢";
    document.getElementById("pNome").value = "";
    document.getElementById("pCnpj").value = "";
    document.getElementById("pEndereco").value = "";
    document.getElementById("pServico").value = "";
    renderHome();
    showToast("Sistema criado!");

  // Backup completo: todos os locais + itens em 1 arquivo
  window.exportFullBackup = function(){
    const data = {
      app: "controle_manutencao",
      versao: 1,
      exportadoEm: new Date().toISOString(),
      projects: projects,
      itemsByProject: {}
    };
    projects.forEach(function(p){
      data.itemsByProject[p.id] = JSON.parse(localStorage.getItem(itemKey(p.id)) || "[]");
    });
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "backup_manutencao_" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    showToast("Backup salvo na pasta Downloads!");
  };

  window.importFullBackup = function(input){
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const data = JSON.parse(e.target.result);
        if(data && data.projects && data.itemsByProject){
          if(!confirm("Restaurar o backup? Os dados ATUAIS serão substituídos.")) return;
          projects = data.projects;
          saveProjects();
          Object.keys(data.itemsByProject).forEach(function(id){
            localStorage.setItem(itemKey(id), JSON.stringify(data.itemsByProject[id]));
          });
          currentProjectId = null;
          goHome();
          showToast("Backup restaurado!");
        } else if(Array.isArray(data)){
          alert("Este arquivo é um backup de ITENS de um local. Abra o local desejado e use 'Importar JSON' dentro dele.");
        } else {
          alert("Arquivo de backup inválido.");
        }
      }catch(err){ alert("Erro ao restaurar backup."); }
    };
    reader.readAsText(file);
    input.value = "";
  };

  window.openProject = function(id){
    currentProjectId = id;
    loadItems();
    const p = getProject(id);
    document.getElementById("appTitle").textContent = projIcon(p) + " " + p.nome;
    let sub = [];
    if(p.cnpj) sub.push("CNPJ: " + p.cnpj);
    if(p.endereco) sub.push("📍 " + p.endereco);
    document.getElementById("appSubtitle").textContent = sub.join("  |  ");
    document.getElementById("homeView").style.display = "none";
    document.getElementById("appView").style.display = "block";
    window.scrollTo(0,0);
    render();
  };

  window.goHome = function(){
    currentProjectId = null;
    document.getElementById("appView").style.display = "none";
    document.getElementById("homeView").style.display = "block";
    renderHome();
    window.scrollTo(0,0);
  };

    editingProjectId = id;

    document.getElementById("projectModalTitle").textContent = "Editar local";
    document.getElementById("pmIcon").value = projIcon(p);
    document.getElementById("pmNome").value = p.nome;
    document.getElementById("pmCnpj").value = p.cnpj || "";

    document.getElementById("pmServico").value = p.servico || "";
    document.getElementById("projectModalOverlay").classList.add("open");
  };

  window.editCurrentProject = function(){ editProject(currentProjectId); };

  window.saveProjectModal = function(){
    const idEditando = editingProjectId; // captura antes de fechar (bug fix)
    const nome = document.getElementById("pmNome").value.trim();
    if(!nome){ alert("Informe o nome do local / projeto."); return; }
    const p = getProject(idEditando);
    if(!p){ closeProjectModal(); return; }
    p.icon = document.getElementById("pmIcon").value;
    p.nome = nome;
    p.cnpj = document.getElementById("pmCnpj").value.trim();
    p.endereco = document.getElementById("pmEndereco").value.trim();
    p.servico = document.getElementById("pmServico").value.trim();
    saveProjects();
    closeProjectModal();
    if(currentProjectId === idEditando){
      openProject(idEditando); // atualiza tela do sistema aberto
    } else {
      renderHome();
    }
    showToast("Dados salvos!");
  };

  window.closeProjectModal = function(){
    document.getElementById("projectModalOverlay").classList.remove("open");
    editingProjectId = null;
  };

  window.deleteProject = function(id){
    const p = getProject(id);
    if(!p) return;
    if(!confirm(`Apagar o sistema "${p.nome}" e TODOS os seus itens?`)) return;
    if(!confirm("Tem certeza? Essa ação não pode ser desfeita!")) return;
    projects = projects.filter(x=>x.id!==id);
    localStorage.removeItem(itemKey(id));
    if(currentProjectId === id) goHome();
    saveProjects();
    renderHome();
    showToast("Sistema apagado.");
  };

  let editingId = null;
  let tempPhotos = { antes: [], depois: [] };
  let searchTimer = null;
  let selectedIds = new Set();

  function loadItems(){
    let data = loadProjectItems(getProject(currentProjectId) || {id: currentProjectId});
    data.forEach(it=>{
      if(!Array.isArray(it.photos)) it.photos = [];
      if(!Array.isArray(it.photosDepois)) it.photosDepois = [];
      if(typeof it.docBaixado === "undefined") it.docBaixado = !!it.pdfBaixado;
    });
    items = data;
    selectedIds = new Set();
  }

  function saveStore(){ localStorage.setItem(itemKey(currentProjectId), JSON.stringify(items)); }

  function badgeClass(s){ return s==="urgente"?"badge-urgente":s==="atencao"?"badge-atencao":s==="ok"?"badge-ok":"badge-info"; }
  function badgeLabel(s){ return s==="urgente"?"Urgente":s==="atencao"?"Atenção":s==="ok"?"OK":"Info"; }
  function sectionName(s){ return s==="pendencias"?"Pendências":s==="naovistos"?"Não vistos":s==="orcamentos"?"Orçamentos":"Arquivados"; }
  function escapeHtml(t){ const d=document.createElement("div"); d.textContent=t; return d.innerHTML; }

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 3000);
  }

  function renderStats(){
    const counts = {pendencias:0, naovistos:0, orcamentos:0, arquivados:0, urgente:0, novos:0};
    items.forEach(it=>{
      if(it.arquivado) counts.arquivados++;
      else { counts[it.section]++; }
      if(it.status==="urgente" && !it.arquivado) counts.urgente++;
      if(!it.docBaixado && !it.arquivado) counts.novos++;
    });
    const el = document.getElementById("stats");
    el.innerHTML = `
      <div class="stat"><div class="stat-value">${counts.pendencias}</div><div class="stat-label">Pendências</div></div>
      <div class="stat"><div class="stat-value">${counts.naovistos}</div><div class="stat-label">Não vistos</div></div>
      <div class="stat"><div class="stat-value">${counts.orcamentos}</div><div class="stat-label">Orçamentos</div></div>
      <div class="stat"><div class="stat-value" style="color:#6a1b9a">${counts.arquivados}</div><div class="stat-label">Arquivados</div></div>
      <div class="stat"><div class="stat-value" style="color:#c00">${counts.urgente}</div><div class="stat-label">Urgentes</div></div>
      <div class="stat"><div class="stat-value" style="color:#9c7105">${counts.novos}</div><div class="stat-label">Novos (sem PDF)</div></div>

  function thumbsHtml(it){
    let h = "";
    if(it.photos.length) h += `<div class="thumbs"><span class="thumbs-label">📷 Antes</span>${it.photos.map(p=>`<img class="thumb" src="${p}" onclick="openLightbox('${p}')" alt="">`).join("")}</div>`;
    if(it.photosDepois.length) h += `<div class="thumbs"><span class="thumbs-label">✅ Depois</span>${it.photosDepois.map(p=>`<img class="thumb" src="${p}" onclick="openLightbox('${p}')" alt="">`).join("")}</div>`;
    return h;
  }

  function cardHtml(it, showSection){
    return `
      <div class="card">
        <div style="display:flex;align-items:flex-start;gap:10px;">
          <div class="checkbox-wrap" style="margin-top:2px;">
            <input type="checkbox" ${selectedIds.has(it.id)?"checked":""} onchange="toggleSelect(${it.id}, this.checked)">
          </div>
          <div style="flex:1;min-width:0;">
            <div class="card-title">${escapeHtml(it.room)} ${showSection?`<span style="font-size:12px;color:#999">(${sectionName(it.section)})</span>`:""} ${it.arquivado?'<span class="badge badge-arq">Arquivado</span>':''}</div>
            <div class="card-meta"><span class="badge ${badgeClass(it.status)}">${badgeLabel(it.status)}</span> #${it.id} <span class="doc-tag ${it.docBaixado?'':'pending'}">${it.docBaixado?'✓ PDF':'⏳ Sem PDF'}</span></div>
          </div>
        </div>
        <div class="card-body">${escapeHtml(it.desc).replace(/\n/g,"<br>")}</div>
        ${thumbsHtml(it)}
        <div class="row-actions">
          <button class="btn" onclick="quickAddPhoto(${it.id},'antes')">📷 Antes</button>
          <button class="btn" onclick="quickAddPhoto(${it.id},'depois')">✅ Depois</button>
          <button class="btn" onclick="editItem(${it.id})">✏️ Editar</button>
          <button class="btn btn-success" onclick="downloadItemPDF(${it.id})">📤 Compartilhar PDF</button>
          <button class="btn" onclick="toggleArchiveItem(${it.id})">${it.arquivado?'📂 Desarq.':'📁 Arquivar'}</button>
          <button class="btn btn-danger" onclick="deleteItem(${it.id})">🗑️ Remover</button>
        </div>
      </div>`;
  }

  function renderSection(section, containerId){
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const isArq = section === "arquivados";
    const list = items.filter(it=>{
      if(isArq) return it.arquivado;
      return it.section===section && !it.arquivado;
    }).filter(it=>!q || it.room.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q));
    const el = document.getElementById(containerId);
    if(!list.length){ el.innerHTML = '<div class="empty">Nenhum item nesta seção.</div>'; return; }
    el.innerHTML = list.map(it=>cardHtml(it,false)).join("");
  }

  function render(){
    renderStats();
    renderSection("pendencias","pendencias");
    renderSection("naovistos","naovistos");
    renderSection("orcamentos","orcamentos");
    renderSection("arquivados","arquivados");
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const all = items.filter(it=>!q || it.room.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q));
    const el = document.getElementById("todos");
    if(!all.length){ el.innerHTML = '<div class="empty">Nenhum item encontrado.</div>'; }
    else { el.innerHTML = all.map(it=>cardHtml(it,true)).join(""); }
    updateBatchBar();
  }

  window.openModal = function(id){
    editingId = id || null;
    tempPhotos = { antes: [], depois: [] };
    document.getElementById("photoPreviewAntes").innerHTML = "";
    document.getElementById("photoPreviewDepois").innerHTML = "";
    document.getElementById("fPhotos").value = "";
    document.getElementById("fPhotosDepois").value = "";
    if(id){
      const it = items.find(x=>x.id===id);
      document.getElementById("modalTitle").textContent = "Editar item";
      document.getElementById("fSection").value = it.section;
      document.getElementById("fRoom").value = it.room;
      document.getElementById("fDesc").value = it.desc;
      document.getElementById("fStatus").value = it.status;
      tempPhotos.antes = it.photos.slice();
      tempPhotos.depois = it.photosDepois.slice();
      renderTempPreview("antes");
      renderTempPreview("depois");
    } else {
      document.getElementById("modalTitle").textContent = "Novo item";
      document.getElementById("fSection").value = "pendencias";
      document.getElementById("fRoom").value = "";
      document.getElementById("fDesc").value = "";

  window.closeModal = function(){ document.getElementById("modalOverlay").classList.remove("open"); editingId=null; tempPhotos={antes:[],depois:[]}; };

  function processImage(file, cb){
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = ()=>cb(e.target.result);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  window.previewPhotos = function(input, tipo){
    const files = Array.from(input.files || []);
    if(!files.length) return;
    let done = 0;
    files.forEach(f=>{
      processImage(f, dataUrl=>{
        tempPhotos[tipo].push(dataUrl);
        done++;
        if(done === files.length){
          renderTempPreview(tipo);
          input.value = "";
        }
      });
    });
  };

  function renderTempPreview(tipo){
    const el = document.getElementById(tipo === "antes" ? "photoPreviewAntes" : "photoPreviewDepois");
    el.innerHTML = tempPhotos[tipo].map((p, i)=>
      `<div style="position:relative;">
        <img class="thumb" src="${p}" onclick="openLightbox('${p}')" alt="">
        <button onclick="removeTempPhoto('${tipo}',${i})" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:#c00;color:#fff;font-size:13px;line-height:22px;cursor:pointer;">×</button>
      </div>`
    ).join("");
  }

  window.removeTempPhoto = function(tipo, idx){
    tempPhotos[tipo].splice(idx, 1);
    renderTempPreview(tipo);
  };

  window.saveItem = function(){
    const section = document.getElementById("fSection").value;
    const room = document.getElementById("fRoom").value.trim();
    const desc = document.getElementById("fDesc").value.trim();
    const status = document.getElementById("fStatus").value;
    if(!room){ alert("Informe o quarto / andar / local."); return; }
    if(!desc){ alert("Descreva o problema ou observação."); return; }
    if(editingId){
      const it = items.find(x=>x.id===editingId);
      if(it){
        it.section = section;
        it.room = room;
        it.desc = desc;
        it.status = status;
        it.photos = tempPhotos.antes.slice();
        it.photosDepois = tempPhotos.depois.slice();
      }
      showToast("Item atualizado!");
    } else {
      const newId = items.length ? Math.max(...items.map(x=>x.id)) + 1 : 1;
      items.push({
        id: newId,
        section: section,
        room: room,
        desc: desc,
        status: status,
        photos: tempPhotos.antes.slice(),
        photosDepois: tempPhotos.depois.slice(),
        arquivado: false,
        docBaixado: false
      });
      showToast("Item salvo!");
    }
    saveStore();
    closeModal();
    render();
  };

  window.editItem = function(id){ openModal(id); };

  window.deleteItem = function(id){
    const it = items.find(x=>x.id===id);
    if(!it) return;
    if(!confirm(`Remover o item "${it.room}"?`)) return;
    items = items.filter(x=>x.id!==id);
    selectedIds.delete(id);
    saveStore();
    render();
    showToast("Item removido.");
  };

  window.toggleArchiveItem = function(id){
    const it = items.find(x=>x.id===id);
    if(!it) return;
    it.arquivado = !it.arquivado;
    saveStore();
    render();
    showToast(it.arquivado ? "Item arquivado." : "Item desarquivado.");
  };

  window.quickAddPhoto = function(id, tipo){
    const it = items.find(x=>x.id===id);
    if(!it) return;
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.capture = "environment";
    input.onchange = ()=>{
      const file = input.files[0];
      if(!file) return;
      processImage(file, dataUrl=>{
        if(tipo === "antes") it.photos.push(dataUrl);
        else it.photosDepois.push(dataUrl);
        saveStore();
        render();
        showToast("Foto adicionada!");
      });
    };
    input.click();
  };

  window.openLightbox = function(src){
    document.getElementById("lightboxImg").src = src;
    document.getElementById("lightbox").classList.add("open");
  };

  window.toggleSelect = function(id, checked){
    if(checked) selectedIds.add(id);
    else selectedIds.delete(id);
    updateBatchBar();
  };

  function updateBatchBar(){
    const bar = document.getElementById("batchBar");
    if(selectedIds.size){
      bar.classList.add("open");
      document.getElementById("batchCount").textContent = selectedIds.size + " selecionado(s)";
    } else {

  window.batchArchive = function(){
    items.forEach(it=>{ if(selectedIds.has(it.id)) it.arquivado = true; });
    selectedIds.clear();
    saveStore();
    render();
    showToast("Itens arquivados!");

  window.batchUnarchive = function(){
    items.forEach(it=>{ if(selectedIds.has(it.id)) it.arquivado = false; });

  // PDF (jsPDF via CDN) — COMPARTILHAR

  function getJsPDF(){
    if(window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
    alert("Biblioteca de PDF não carregada. Verifique a conexão com a internet e recarregue a página.");
    return null;
  }

  function buildItemPDF(it, existingDoc, isContinuation){
    const JsPDF = getJsPDF();
    if(!JsPDF) return null;
    const p = getProject(currentProjectId) || {};
    const doc = existingDoc || new JsPDF({ unit: "mm", format: "a4" });
    if(isContinuation) doc.addPage();
    const pageW = doc.internal.pageSize.getWidth();
    const margin = 14;
    let y = 18;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(15);
    doc.setTextColor(20, 20, 20);
    doc.text("Relatório de Manutenção", margin, y);
    y += 7;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(110);
    let sub = [];
    if(p.nome) sub.push(p.nome);
    if(p.cnpj) sub.push("CNPJ: " + p.cnpj);
    if(p.endereco) sub.push(p.endereco);
    if(sub.length){ doc.text(sub.join("  |  "), margin, y); y += 5; }
    doc.text("Emitido em: " + new Date().toLocaleString("pt-BR"), margin, y);
    y += 6;
    doc.setDrawColor(220);
    doc.line(margin, y, pageW - margin, y);
    y += 8;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.setTextColor(20);
    doc.text(it.room, margin, y);
    y += 6;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.setTextColor(110);
    doc.text("Seção: " + sectionName(it.section) + "   |   Status: " + badgeLabel(it.status) + "   |   Item #" + it.id, margin, y);
    y += 8;

    doc.setFontSize(11);
    doc.setTextColor(40);
    const lines = doc.splitTextToSize(it.desc, pageW - margin * 2);
    doc.text(lines, margin, y);
    y += lines.length * 5 + 4;

    function addPhotos(photos, label){
      if(!photos || !photos.length) return;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(10);
      doc.setTextColor(20);
      if(y > 250){ doc.addPage(); y = 18; }
      doc.text(label, margin, y);
      y += 3;
      const imgW = (pageW - margin * 2 - 8) / 2;
      let x = margin;
      photos.forEach(ph=>{
        try{
          if(y + imgW * 0.75 > 285){ doc.addPage(); y = 18; x = margin; }
          doc.addImage(ph, "JPEG", x, y, imgW, imgW * 0.75);
          x += imgW + 8;
          if(x + imgW > pageW - margin + 1){ x = margin; y += imgW * 0.75 + 6; }
        }catch(e){}
      });
      if(x !== margin) y += imgW * 0.75 + 6;
      y += 4;
    }

    addPhotos(it.photos, "Fotos ANTES:");
    addPhotos(it.photosDepois, "Fotos DEPOIS:");

    return doc;
  }

  function pdfFileName(it){
    const safe = it.room.replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "_");
    return "manutencao_" + safe + "_" + it.id + ".pdf";
  }

  function docToFile(doc, it){
    const blob = doc.output("blob");
    return new File([blob], pdfFileName(it), { type: "application/pdf" });
  }

  async function shareFiles(files, title){
    if(!navigator.canShare || !navigator.canShare({ files: files })){
      alert("Este aparelho não suporta compartilhamento de arquivos.\nAtualize o Android System WebView na Play Store e tente novamente.");
      return false;
    }
    try{
      await navigator.share({ files: files, title: title });
      return true;
    }catch(e){
      return false; // usuário cancelou
    }
  }

  window.downloadItemPDF = async function(id){
    const it = items.find(x=>x.id===id);
    if(!it) return;
    const doc = buildItemPDF(it);
    if(!doc) return;
    const ok = await shareFiles([docToFile(doc, it)], "Relatório de Manutenção");
    if(ok){
      it.docBaixado = true;
      saveStore();
      render();
      showToast("PDF compartilhado!");
    }
  };

  window.batchPDF = async function(){
    tutCtx("pdf", "PDF dos selecionados 📄", "Selecione os itens desejados e toque em <b>📄 PDF selec.</b>.<br><br>O sistema gera <b>um único PDF</b> com todos eles, abre em uma nova página e permite <b>compartilhar tudo junto</b> (WhatsApp, e-mail etc.).");
    const sel = items.filter(it=>selectedIds.has(it.id));
    if(!sel.length){ alert("Selecione pelo menos um item."); return; }
    let doc = null;
    sel.forEach(function(it, i){ doc = buildItemPDF(it, doc, i > 0); });
    if(!doc) return;
    const blob = doc.output("blob");
    const file = new File([blob], "manutencao_selecionados_" + sel.length + ".pdf", { type: "application/pdf" });
    openPDFPreview(blob, file.name);
    const ok = await shareFiles([file], "Relatórios de Manutenção");
    if(ok){
      sel.forEach(function(it){ it.docBaixado = true; });
      selectedIds.clear();
      saveStore();
      render();
      showToast("PDF compartilhado!");
    }
  };

  function openPDFPreview(blob, name){
    const url = URL.createObjectURL(blob);
    const w = window.open(url, "_blank");
    if(!w){
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast("Aba bloqueada — PDF baixado!");
    }
    setTimeout(function(){ URL.revokeObjectURL(url); }, 120000);
  }

  window.downloadAllNewPDFs = async function(){
    const novos = items.filter(it=>!it.docBaixado && !it.arquivado);
    if(!novos.length){ alert("Não há itens novos (todos já têm PDF)."); return; }
    if(!confirm("Gerar PDF de " + novos.length + " item(ns) novo(s)?")) return;
    const files = [];
    novos.forEach(it=>{
      const doc = buildItemPDF(it);
      if(doc){ files.push(docToFile(doc, it)); it.docBaixado = true; }
    });
    const ok = await shareFiles(files, "Relatórios de Manutenção");
    if(ok){
      saveStore();
      render();
      showToast(novos.length + " PDF(s) compartilhado(s)!");
    }
  };

  window.importData = function(input){
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const data = JSON.parse(e.target.result);
        if(!Array.isArray(data)){ alert("Arquivo inválido."); return; }
        if(!confirm("Importar " + data.length + " item(ns)? Os dados atuais serão SUBSTITUÍDOS.")) return;
        data.forEach(it=>{
          if(!Array.isArray(it.photos)) it.photos = [];
          if(!Array.isArray(it.photosDepois)) it.photosDepois = [];
          if(typeof it.docBaixado === "undefined") it.docBaixado = !!it.pdfBaixado;
        });
        items = data;
        selectedIds = new Set();
        saveStore();
        render();
        showToast("Dados importados!");
      }catch(err){ alert("Erro ao importar: " + err.message); }
    };
    reader.readAsText(file);
    input.value = "";
  };

    { title:"5️⃣ Faça backup", html:"Use <b>💾 Backup geral</b> para salvar tudo em um arquivo JSON e <b>⬆️ Restaurar backup</b> para recuperar.<br><br>Seus dados ficam guardados no navegador do aparelho." }
  ];

  const TUT_RAPIDO = [
    { title:"Tutorial rápido ⚡", html:"O essencial do sistema em cerca de 1 minuto." },
    { title:"1. Cadastre o local/equipamento", html:"Crie um sistema para cada local na <b>tela inicial</b>." },
    { title:"2. Registre o problema", html:"Use <b>+ Adicionar item</b>: informe quarto/local, descrição e status." },
    { title:"3. Acompanhe o status", html:"Marque como <b>Urgente</b>, <b>Atenção</b>, <b>OK</b> ou <b>Info</b> e acompanhe pelas abas." },
    { title:"4. Controle materiais/compras", html:"A aba <b>Orçamentos</b> reúne o que precisa ser comprado ou orçado no futuro." },
    { title:"5. Faça o serviço", html:"Registre o que foi feito na descrição do item." },
    { title:"6. Fotos e relatório", html:"Adicione fotos de antes/depois e gere o <b>PDF</b>." },
    { title:"7. Conclua e arquive", html:"Ao resolver, use <b>📁 Arquivar</b> — sai das pendências e fica no histórico." },
    { title:"8. Consulte o histórico", html:"As abas <b>Arquivados</b> e <b>Todos</b> mostram tudo que já aconteceu. ✅" }
  ];

  const TUT_TOPICS = [
    { icon:"🏢", title:"Como cadastrar um local", steps:[
      { title:"Cadastro de local 🏢", html:"Na tela inicial, preencha o <b>nome do local</b> (obrigatório) e, se quiser, CNPJ, endereço e serviço em geral.", target:"#pNome" },
      { title:"Criar sistema", html:"Toque em <b>Criar sistema</b>. Você poderá registrar <b>vários problemas diferentes</b> nesse mesmo local ao longo do tempo.", target:"#pNome" }
    ]},
    { icon:"➕", title:"Como registrar um problema", steps:[
      { title:"Adicionar ocorrência ➕", html:"Use <b>+ Adicionar item</b> quando encontrar um novo problema ou serviço." },
      { title:"Local + descrição", html:"Informe o <b>quarto / andar / local</b> e descreva o problema com detalhes.", target:"#fRoom" },
      { title:"Mesmo local, novo problema", html:"📌 Se o mesmo quarto tiver outro problema depois, <b>não crie outro local</b> — crie uma nova ocorrência. Assim o histórico fica reunido." }
    ]},
    { icon:"🔁", title:"Como alterar o status", steps:[
      { title:"Status 🔁", html:"O status mostra em que etapa a manutenção está: <b>Urgente → Atenção → OK/Resolvido</b>." },
      { title:"Como mudar", html:"Toque em <b>✏️ Editar</b> no item e escolha o novo status. O item muda automaticamente de aba/filtro conforme o status." }
    ]},
    { icon:"📷", title:"Como adicionar fotos", steps:[
      { title:"Fotos 📷", html:"Documente o problema e o resultado:" },
      { title:"Quando fotografar", html:"• <b>Antes</b> — o problema como estava<br>• <b>Depois</b> — como ficou o serviço<br>• Placa/dados do equipamento<br>• Detalhes do defeito" },
      { title:"Como adicionar", html:"No cadastro do item, use os campos de fotos — ou toque em <b>📷 Antes</b> / <b>✅ Depois</b> direto no card do item." }
    ]},
    { icon:"📄", title:"Como gerar PDF", steps:[
      { title:"Relatórios em PDF 📄", html:"O PDF é gerado <b>pelo próprio sistema</b>, sem depender do aplicativo." },
      { title:"PDF dos novos", html:"<b>📄 PDF dos novos</b> gera um relatório com todos os itens ainda não enviados." },
      { title:"PDF selecionados", html:"Marque os itens desejados e toque em <b>📄 PDF selec.</b> — todos abrem <b>juntos em uma única página</b> e você pode <b>compartilhar tudo junto</b>." }
    ]},
    { icon:"🧾", title:"Como criar orçamento", steps:[
      { title:"Orçamentos 🧾", html:"A aba <b>Orçamentos</b> reúne os serviços que dependem de orçamento: peças, instalações, mão de obra, material + mão de obra." },
      { title:"Como registrar", html:"Crie um item com a seção <b>Orçamentos</b> descrevendo o que precisa ser orçado: materiais, quantidades, valores e observações." }
    ]},
    { icon:"🗂️", title:"Como consultar o histórico", steps:[
      { title:"Histórico 🗂️", html:"Tudo que aconteceu fica guardado. Nada é apagado quando um novo evento é criado." },
      { title:"Onde ver", html:"A aba <b>Arquivados</b> mostra os itens concluídos e <b>Todos</b> mostra o quadro completo do local." }
    ]},
    { icon:"🔍", title:"Como pesquisar e filtrar", steps:[
      { title:"Pesquisa 🔍", html:"Use a busca para encontrar rapidamente um local, quarto, equipamento, problema ou material.", target:"#searchInput" },
      { title:"Exemplos", html:"• <b>444</b> → encontra o quarto 444<br>• <b>compressor</b> → ocorrências de compressor<br>• <b>vazamento</b> → problemas de vazamento<br>• <b>R410A</b> → registros com R410A" }
    ]},
    { icon:"💾", title:"Como fazer backup", steps:[
      { title:"Backup 💾", html:"Toque em <b>💾 Backup geral</b> na tela inicial. Um arquivo JSON com <b>todos os locais e itens</b> (incluindo fotos) será salvo na pasta Downloads." },
      { title:"Importante", html:"Os dados ficam no <b>navegador do aparelho</b>. Faça backup regularmente e guarde o arquivo com segurança." }
    ]},
    { icon:"⬆️", title:"Como restaurar backup", steps:[
      { title:"Restaurar ⬆️", html:"Na tela inicial, toque em <b>⬆️ Restaurar backup</b> e escolha o arquivo JSON salvo." },
      { title:"Atenção", html:"A restauração <b>substitui os dados atuais</b>. Confirme apenas se tiver certeza do arquivo." }
    ]}
  ];

  // ---- Motor do tutorial ----
  let tutSteps = [], tutIdx = 0, tutMode = "", tutKey = "";

  function ensureTutDOM(){
    if(document.getElementById("tutOverlay")) return;
    const o = document.createElement("div");
    o.id = "tutOverlay";
    o.className = "tut-overlay";
    o.innerHTML = '<div class="tut-card" id="tutCard"></div>';
    o.addEventListener("click", function(e){ if(e.target === o) tutClose(); });
    document.body.appendChild(o);
  }
  function tutShowCard(inner){
    ensureTutDOM();
    document.getElementById("tutCard").innerHTML = inner;
    document.getElementById("tutOverlay").classList.add("open");
  }
  window.tutClose = function(){
    const o = document.getElementById("tutOverlay");
    if(o) o.classList.remove("open");
    document.querySelectorAll(".tut-highlight").forEach(function(e){ e.classList.remove("tut-highlight"); });
  };
  function tutPlay(steps, mode, key){
    tutSteps = steps; tutIdx = 0; tutMode = mode || ""; tutKey = key || "";
    tutRender();
  }
  window.tutPlay = tutPlay;
  window.tutNext = function(){
    if(tutIdx < tutSteps.length - 1){ tutIdx++; tutRender(); }
    else tutFinish(false);
  };
  window.tutSkip = function(){ tutFinish(true); };
  function tutFinish(skipped){
    const chk = document.getElementById("tutDont");
    const dont = chk && chk.checked;
    if(tutMode === "intro"){ tutState.intro = true; if(skipped) tutState.skipAll = true; }
    else if(tutMode === "rapido"){ tutState.rapido = true; }
    else if(tutMode === "topic"){ /* sempre pode reabrir pelo menu */ }
    else if(tutMode === "ctx" && tutKey){
      tutState.ctx[tutKey] = true;
      if(dont) tutState.dont[tutKey] = true;
    }
    tutSave();
    tutClose();
  }
  function tutRender(){
    const s = tutSteps[tutIdx];
    document.querySelectorAll(".tut-highlight").forEach(function(e){ e.classList.remove("tut-highlight"); });
    if(s && s.target){
      const el = document.querySelector(s.target);
      if(el){
        el.classList.add("tut-highlight");
        try{ el.scrollIntoView({ block:"center", behavior:"smooth" }); }catch(e){}
      }
    }
    const last = tutIdx === tutSteps.length - 1;
    const isCtx = tutMode === "ctx";
    const labelSkip = isCtx ? "Agora não" : "Pular";
    tutShowCard(
      '<h3>' + s.title + '</h3>' +
      '<div class="tut-body">' + s.html + '</div>' +
      '<div class="tut-progress">Passo ' + (tutIdx + 1) + ' de ' + tutSteps.length + '</div>' +
      (isCtx ? '<label class="tut-dont"><input type="checkbox" id="tutDont"> Não mostrar esta explicação novamente</label>' : '') +
      '<div class="tut-actions">' +
        '<button class="btn" onclick="tutSkip()">' + labelSkip + '</button>' +
        '<button class="btn btn-primary" onclick="tutNext()">' + (last ? 'Entendi ✓' : 'Próximo') + '</button>' +
      '</div>' +
      (!isCtx && tutSteps.length > 1 ? '<button class="tut-skip" onclick="tutSkip()">Pular tudo</button>' : '')
    );
  }

  // ---- Ajuda contextual (aparece 1 vez por função) ----
  function tutCtx(key, title, text, targetSel){
    if(tutState.skipAll || tutState.ctx[key] || tutState.dont[key]) return;
    tutPlay([{ title:title, html:text, target:targetSel || null }], "ctx", key);
  }

  // ---- Menu "Como usar" ----
  function tutOpenMenu(){
    const topics = TUT_TOPICS.map(function(t, i){
      return '<button class="tut-topic" onclick="tutPlayTopic(' + i + ')"><span style="font-size:18px;">' + t.icon + '</span><span>' + t.title + '</span></button>';
    }).join("");
    tutShowCard(
      '<h3>❓ Como usar</h3>' +
      '<div class="tut-body">' +
        '<button class="tut-topic" onclick="tutPlay(TUT_INTRO, \'intro\')"><span>🎬</span><span>Ver apresentação inicial</span></button>' +
        '<button class="tut-topic" onclick="tutPlay(TUT_RAPIDO, \'rapido\')"><span>⚡</span><span>Tutorial rápido (1–2 min)</span></button>' +
        topics +
      '</div>' +
      '<button class="tut-skip" onclick="tutClose()">Fechar ✕</button>'
    );
  }
  window.tutOpenMenu = tutOpenMenu;
  window.tutPlayTopic = function(i){ tutPlay(TUT_TOPICS[i].steps, "topic"); };
  window.TUT_INTRO = TUT_INTRO;
  window.TUT_RAPIDO = TUT_RAPIDO;

  // ---- Ganchos de primeiro uso (preservam as funções originais) ----
  const _openModalOrig = window.openModal;
  window.openModal = function(id){
    _openModalOrig(id);
    if(!id) tutCtx("addItem", "Adicionar ocorrência ➕",
      "Use este formulário quando encontrar um <b>novo problema</b> ou precisar registrar um novo serviço.<br><br>📌 Se o mesmo quarto tiver outro problema no futuro, crie uma <b>nova ocorrência</b> — o histórico fica reunido no mesmo local.",
      "#fRoom");
  };

  const _quickAddPhotoOrig = window.quickAddPhoto;
  window.quickAddPhoto = function(id, tipo){
    tutCtx("fotos", "Adicionar fotos 📷",
      "Fotografe para documentar o problema e o resultado:<br>• <b>Antes</b> — como estava<br>• <b>Depois</b> — como ficou o serviço");
    _quickAddPhotoOrig(id, tipo);
  };

  const _exportBackupOrig = window.exportFullBackup;
  window.exportFullBackup = function(){
    tutCtx("backup", "Backup 💾",
      "O backup salva <b>todos os locais e itens</b> (incluindo fotos) em um arquivo JSON na pasta Downloads.<br><br>Guarde esse arquivo com segurança — é a cópia completa do seu sistema.");
    _exportBackupOrig();
  };

  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      if(t.dataset.tab === "orcamentos"){
        tutCtx("orcamentos", "Área de Orçamentos 🧾",
          "Aqui ficam os serviços que precisam de <b>orçamento futuro</b>: peças, instalações ou serviços a planejar.<br><br>Registre o que precisa ser orçado e acompanhe nesta aba.");
      }
      if(t.dataset.tab === "arquivados"){
        tutCtx("arquivados", "Histórico / Arquivados 🗂️",
          "Itens arquivados são serviços <b>concluídos</b>. Eles saem das pendências mas <b>nunca são apagados</b> — formam o histórico do local.");
      }
    });
  });

  // ---- Apresentação inicial (apenas no primeiro acesso) ----
  if(!tutState.intro && !tutState.skipAll){
    setTimeout(function(){ tutPlay(TUT_INTRO, "intro"); }, 700);
  }

  renderHome();
})();
</script>  </body>
